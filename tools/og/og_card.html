<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; background: #ffffff; color: #0a0a0a; font-family: "Instrument Sans", system-ui, sans-serif; }
  .card { position: relative; width: 1200px; height: 630px; padding: 72px 80px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; }
  .label { font-size: 22px; letter-spacing: 0.08em; text-transform: uppercase; color: #6b6b6b; font-weight: 500; }
  h1 { margin: 0; font-size: 96px; line-height: 0.95; letter-spacing: -0.02em; font-weight: 500; max-width: 900px; }
  .name { font-size: 30px; font-weight: 600; }
  .bar { position: absolute; left: 0; bottom: 0; width: 1200px; height: 28px; background: #2f4bff; }
</style>
</head>
<body>
<div class="card">
  <span class="label">Mentoring · Consulting · Telesalud</span>
  <h1>Medicine, data, and clear answers.</h1>
  <span class="name">Niels Pacheco-Barrios, MD · Harvard Medical School</span>
  <div class="bar"></div>
</div>
</body>
</html>
